name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # Without submodules: the vendored footprint libraries are upstream's and
      # nothing here checks them, so fetching them only costs time.
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eslint.config.mjs scopes this to the footprints written here rather
      # than vendored.
      - name: Lint
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # Pinned in the gate rather than taken from the runner image, so a PyYAML
      # release cannot turn this red on a commit that did not touch the configs.
      - name: Install PyYAML
        run: pip install pyyaml==6.0.3

      # The ESPHome and Home Assistant configs are the whole of what this
      # repository ships, and nothing reads them until they are flashed or
      # reloaded, so a bad indent surfaces on the device rather than here.
      #
      # Syntax only. `!secret` and `!lambda` are ESPHome's, and resolving them
      # would mean holding a copy of its schema that drifts, so unknown tags are
      # accepted as opaque. Duplicate keys are rejected, which plain safe_load
      # allows: the later block silently replaces the earlier one, and a config
      # that loses an automation that way loads clean.
      #
      # Every tracked YAML outside .github/, so a later board revision is
      # covered without anyone remembering to add it here.
      - name: Check that every config is valid YAML
        run: |
          git ls-files -z '*.yml' '*.yaml' ':!:.github/**' |
            xargs -0 python3 -c '
          import sys, yaml

          class Loader(yaml.SafeLoader):
              pass

          def mapping(loader, node, deep=False):
              seen, out = set(), {}
              for kn, vn in node.value:
                  k = loader.construct_object(kn, deep=deep)
                  if k in seen:
                      raise SystemExit(f"{path}:{kn.start_mark.line + 1}: duplicate key {k!r}")
                  seen.add(k)
                  out[k] = loader.construct_object(vn, deep=deep)
              return out

          Loader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)
          Loader.add_multi_constructor("", lambda loader, suffix, node: None)

          for path in sys.argv[1:]:
              print(path)
              with open(path) as f:
                  yaml.load(f, Loader=Loader)
          '
